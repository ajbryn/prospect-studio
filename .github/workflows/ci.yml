name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # Windows because the POC targets Windows only: PsOptions defaults resolve
    # %LOCALAPPDATA% and Documents, and the server ships as a win-x64 exe.
    runs-on: windows-latest

    # Both configurations on purpose. Release compiles out the #if DEBUG tools,
    # so a Debug-only test file silently loses its coverage there - which is
    # exactly what the C0 review caught in ErrorContractTests.
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    name: test (${{ matrix.configuration }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ProspectStudio.sln

      - name: Build
        run: dotnet build src/ProspectStudio.sln --no-restore -c ${{ matrix.configuration }}

      # DuckDB fetches spatial/httpfs on first use and caches them under
      # ~/.duckdb. Tests must not hit the network, so prime the cache here via
      # the doctor verb and let the tests LOAD from disk. Bump the key when the
      # DuckDB.NET version changes.
      - name: Cache DuckDB extensions
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-v1.5.6

      - name: Prime DuckDB extensions
        run: dotnet run --project src/ProspectStudio.Mcp -c ${{ matrix.configuration }} --no-build -- doctor

      # Category=Network tests hit live APIs and are opt-in per CLAUDE.md.
      - name: Test
        run: dotnet test src/ProspectStudio.sln --no-build -c ${{ matrix.configuration }} --filter "Category!=Network"
